[project]
name = "nexfix"
version = "0.1.0"
description = "NexFix service"
readme = "README.md"
authors = [
    { name = "D.R.W", email = "delete.read.write@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.0",
    "granian[reload,uvloop]>=2.8.5",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "uvloop>=0.23.0",
]

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_also = [
  ".* = Literal\\[.*\\]",
  ".* = NewType\\(.*\\)",
  "^\\s*pass\\s*$",
  "^\\s*raise\\s*$",
  "from .* import .*",
  "if __name__ == .__main__.:",
  "import .*",
  "logger\\..*",
  "logging\\..*",
]

[tool.coverage.run]
concurrency = ["thread"]
core = "sysmon"
relative_files = true
source = ["src"]
omit = [
  "src/nexfix/bootstrap/**",
  "docker-entrypoint.py",
]

[tool.pytest]
addopts = [
    "--color=yes",
    "-m", "not slow",
    "--strict-config",
    "--strict-markers"
]
filterwarnings = []
markers = ["slow"]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
asyncio_mode = "auto"

[tool.ruff]
target-version = "py313"
line-length = 120
extend-exclude = ["docker-entrypoint.py"]

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "B",
    "UP",
    "ASYNC",
]

[tool.ruff.format]
indent-style = "space"
quote-style = "double"
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.13"
mypy_path = ["src"]
files = ["src"]
exclude = ["^docker-entrypoint\\.py$"]

strict = true
pretty = true
show_error_codes = true
warn_unreachable = true
