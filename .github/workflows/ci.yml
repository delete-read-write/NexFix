name: CI

on: [push, pull_request]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.13

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install Just
        uses: extractions/setup-just@v3

      - name: Run pre-commit hooks
        run: >-
          uv run pre-commit run

      - name: Check code
        run: just check-ci
