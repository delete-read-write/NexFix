repos:
  - repo: local
    hooks:
      - id: ruff-lint
        name: ruff lint
        entry: just lint
        language: unsupported
        pass_filenames: false
        always_run: true

      - id: ruff-format-check
        name: ruff format check
        entry: just format-check
        language: unsupported
        pass_filenames: false
        always_run: true

      - id: mypy
        name: mypy
        entry: just typecheck
        language: unsupported
        pass_filenames: false
        always_run: true

      - id: ruff-lint-fix
        name: ruff lint fix
        entry: just lint-fix
        language: unsupported
        pass_filenames: false
        always_run: true
        stages: [manual]

      - id: ruff-format
        name: ruff format
        entry: just format
        language: unsupported
        pass_filenames: false
        always_run: true
        stages: [manual]
